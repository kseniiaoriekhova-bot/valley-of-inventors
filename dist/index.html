<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Долина винахідників</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Польова станція спостереження: карта — головна, журнал — збоку */
:root {
  --bg: #e4e9ee;
  --panel: #f6f8fa;
  --ink: #17202a;
  --muted: #5b6977;
  --line: #cdd5dd;
  --accent: #c47f12;
  --accent-ink: #ffffff;
  --teal: #2a7570;
  --soft: #e9eef3;
  --bad: #b03a3a;
  --display: 'Unbounded', 'Rubik', system-ui, sans-serif;
  --body: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318; --panel: #161d25; --ink: #e2e8ee; --muted: #91a0ae; --line: #28323d;
    --accent: #f0a73a; --accent-ink: #1a1206; --teal: #56b8ae; --soft: #1c252f; --bad: #e07070;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --panel: #161d25; --ink: #e2e8ee; --muted: #91a0ae; --line: #28323d;
  --accent: #f0a73a; --accent-ink: #1a1206; --teal: #56b8ae; --soft: #1c252f; --bad: #e07070;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- верхня смуга ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; max-width: 1400px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
h1 { font: 700 clamp(18px, 2.6vw, 26px)/1.1 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.era { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); border: 1px solid currentColor; border-radius: 99px; padding: 5px 9px; }
.clock { display: flex; align-items: center; gap: 8px; margin-left: auto; font: 600 13px var(--mono); font-variant-numeric: tabular-nums; }
.sun { width: 54px; height: 10px; border-radius: 99px; background: linear-gradient(90deg, #1d2a4a, #f2c56b 30%, #f7e3a1 50%, #f2c56b 70%, #1d2a4a); position: relative; overflow: hidden; }
.sun::after { content: ''; position: absolute; top: -1px; left: var(--p, 0%); width: 3px; height: 12px; background: var(--ink); }
.controls, .langs { display: flex; gap: 4px; }
.langs .ctl { min-width: 36px; }
.ctl { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; min-width: 40px; font: 600 12px var(--mono); }
.ctl.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* індикатор LLM */
.llmchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 5px 10px; font: 500 12px var(--body); }
.llmchip .ld { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.llmchip[data-mode="ok"] .ld, .llmchip[data-mode="idle"] .ld { background: var(--teal); }
.llmchip[data-mode="paused"] .ld { background: var(--accent); }
.llmchip[data-mode="down"], .llmchip[data-mode="limit"] { border-color: var(--bad); color: var(--bad); }
.llmchip[data-mode="down"] .ld, .llmchip[data-mode="limit"] .ld { background: var(--bad); }
.banner { max-width: 1400px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--panel)); font-size: 13px; }
.banner .bt { flex: 1 1 240px; min-width: 0; }
.banner .bb { display: flex; gap: 6px; align-items: center; }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn.ghost { background: none; color: var(--ink); border-color: var(--line); }
.civs { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.civs li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.civs li.on { border-color: var(--accent); }
.civs .cn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.civs .ci { grid-column: 1; font-size: 12px; color: var(--muted); }
.civs .ca { grid-column: 2; grid-row: 1 / 3; display: flex; gap: 6px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }

/* ---------- показники ---------- */
.stats { max-width: 1400px; margin: 12px auto 12px; display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--ink); font: 600 15px var(--mono); font-variant-numeric: tabular-nums; margin-right: 4px; }

/* ---------- розкладка ---------- */
.layout { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.stage { min-width: 0; }
.canvas-box { position: relative; }
.canvas-wrap { width: 100%; border-radius: var(--r); overflow: auto; background: #1f4f73; line-height: 0; max-height: 78vh; overscroll-behavior: contain; }
.zoom { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; }
.zoom .ctl { background: color-mix(in srgb, var(--panel) 88%, transparent); min-width: 34px; font-size: 15px; padding: 4px 8px; }
canvas { display: block; touch-action: manipulation; cursor: pointer; max-width: none; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 4px; scrollbar-width: thin; overscroll-behavior-x: contain; }
.who-chip { flex: 0 0 auto; display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 7px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 5px 10px 5px 8px; }
.who-chip .dot { grid-row: 1 / 3; }
.who-chip .dot.small { width: 9px; height: 9px; }
.who-chip .wn { font-weight: 500; font-size: 13px; line-height: 1.2; }
.who-chip .wa { font-size: 11px; color: var(--muted); line-height: 1.2; }
.who-chip.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin: 8px 2px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,0.3); }
.lg.dia { border-radius: 1px; transform: rotate(45deg); }
.legend .hint { margin-left: auto; }

/* ---------- бічна панель ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; display: flex; flex-direction: column; max-height: calc(100vh - 140px); }
@media (max-width: 960px) { .panel { max-height: none; } }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 12px 2px; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.pane { display: none; overflow-y: auto; padding: 14px; min-height: 0; }
.pane.on { display: block; }
@media (max-width: 960px) { .pane { max-height: 70vh; } }
h2 { font: 600 13px/1.3 var(--display); margin: 0 0 8px; letter-spacing: 0.01em; }
h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
.muted { color: var(--muted); }
.card { border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 14px; }
.card:last-child { border-bottom: 0; }

/* хроніка */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 4px 10px; font-size: 12px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chron { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.chron li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; padding: 6px 4px; border-radius: 6px; font-size: 13px; }
.chron li .d { font: 600 11px var(--mono); color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.chron li.discovery { background: color-mix(in srgb, var(--accent) 13%, transparent); }
.chron li.discovery .t { font-weight: 500; }
.chron li.era { background: var(--ink); color: var(--bg); }
.chron li.era .d { color: inherit; opacity: 0.7; }
.chron li.idea .t { color: var(--teal); }
.chron li.death .t { color: var(--bad); }
.chron li.talk .t { font-style: italic; }
.chron li.together .t { color: var(--teal); font-weight: 500; }
.chron li.nature .t { color: var(--muted); }
.chron li.system .t { color: var(--muted); font-style: italic; }
.chron li .who { cursor: pointer; text-decoration: underline dotted; }

/* мешканці */
.people { list-style: none; margin: 0; padding: 0; }
.people li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 8px; cursor: pointer; }
.people li:hover, .people li.sel { background: var(--soft); }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #141a20; }
.people .nm { font-weight: 500; }
.people .act { font-size: 12px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score { font: 600 13px var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; text-align: right; }
.score small { display: block; font-weight: 400; color: var(--muted); font-size: 10px; }

.person { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 14px; background: var(--bg); }
.person .head { display: flex; align-items: center; gap: 10px; }
.person .head .nm { font: 600 16px var(--display); }
.person .head { flex-wrap: wrap; }
.person .nav { margin-left: auto; display: flex; gap: 4px; }
.iconbtn { background: none; border: 1px solid var(--line); border-radius: 6px; min-width: 30px; height: 28px; padding: 0 8px; font-size: 14px; line-height: 1; }
.follow { margin-top: 8px; border: 1px solid var(--line); background: none; border-radius: 99px; padding: 4px 12px; font-size: 12px; }
.follow.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.thought { margin: 8px 0; padding: 8px 10px; background: var(--panel); border-radius: 8px; font-size: 13px; }
.thought.llm::before { content: 'LLM · '; font: 600 10px var(--mono); color: var(--teal); }
.meters { display: grid; grid-template-columns: auto minmax(0, 1fr) 34px; gap: 4px 8px; align-items: center; font-size: 12px; }
.meter { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--teal); border-radius: 99px; }
.meter.warn i { background: var(--bad); }
.meter.gold i { background: var(--accent); }
.meters .v { font: 11px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.reward { font-size: 12px; color: var(--accent); margin-top: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); }
.tag.d { border-color: var(--accent); color: var(--accent); }
.tag.i { border-color: var(--teal); color: var(--teal); }
.hist { list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--muted); display: grid; gap: 3px; }

/* відкриття */
.timeline { display: flex; gap: 3px; margin: 4px 0 14px; flex-wrap: wrap; }
.timeline span { font: 500 10px var(--mono); padding: 4px 6px; border-radius: 4px; background: var(--soft); color: var(--muted); }
.timeline span.on { background: var(--accent); color: var(--accent-ink); }
.dev { padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.dev:last-child { border-bottom: 0; }
.dev .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dev .top b { font-weight: 600; }
.q { font: 600 11px var(--mono); color: var(--teal); }
.dev .how { color: var(--muted); font-size: 12px; }
.mats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.mat { border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; font-size: 12px; background: var(--bg); min-width: 0; cursor: pointer; text-align: left; }
.mat .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: -1px; border: 1px solid rgba(0,0,0,0.3); }
.mat .k { display: block; font: 10px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
.mat.new { border-color: var(--accent); }
.mat.real .k { color: var(--teal); }
.matinfo { margin: 10px 0; padding: 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font-size: 13px; }

/* мозок */
.presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin: 10px 0; }
.preset { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px; text-align: left; display: grid; gap: 2px; min-width: 0; }
.preset b { font-weight: 600; font-size: 13px; }
.preset span { font-size: 11px; color: var(--muted); line-height: 1.3; }
.preset.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.presetnote { font-size: 12px; margin: 0 0 8px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 12%, transparent); }
.presetnote a, .steps a { color: inherit; }
.grid2 { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; align-items: center; margin: 10px 0; font-size: 13px; }
.grid2 input, .grid2 select { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 8px; }
.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
.row.gap { gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.switch span { font-weight: 600; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.status { font: 12px var(--mono); color: var(--muted); }
.steps { padding-left: 18px; margin: 0; font-size: 13px; display: grid; gap: 6px; }
code { font: 12px var(--mono); background: var(--soft); padding: 1px 5px; border-radius: 4px; word-break: break-word; }
.plain { padding-left: 18px; margin: 0; font-size: 13px; display: grid; gap: 6px; }
.llmlog { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; font-size: 12px; }
.llmlog li { padding: 6px 8px; border-left: 2px solid var(--teal); background: var(--bg); border-radius: 0 6px 6px 0; }
.llmlog li.bad { border-left-color: var(--bad); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* наздоганяння пропущеного часу */
.away { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(3px);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.awaycard { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.18); }
.awaycard h2 { font-size: 15px; }
.awaycard .meter { height: 8px; margin: 6px 0; }
.awaycard #awayProgress, .awaycard #awaySummary { display: grid; gap: 8px; }
.awaycard #awaySummary[hidden], .awaycard #awayProgress[hidden] { display: none; }

</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <h1 data-i18n="title">Долина винахідників</h1>
    <span class="era" id="era"></span>
  </div>
  <div class="clock">
    <span class="day" id="day"></span>
    <span class="sun" id="sun" aria-hidden="true"></span>
  </div>
  <div class="controls" role="group" data-i18n-aria="aria.speed">
    <button id="pause" class="ctl">❚❚</button>
    <button class="ctl spd" data-s="1">1×</button>
    <button class="ctl spd" data-s="4">4×</button>
    <button class="ctl spd" data-s="15">15×</button>
    <button class="ctl spd" data-s="50">50×</button>
  </div>
  <button class="llmchip" id="llmChip" data-mode="off"><span class="ld" aria-hidden="true"></span><span id="llmChipText"></span></button>
  <div class="langs" role="group" aria-label="Мова / Sprache">
    <button class="ctl lang" data-lang="uk" lang="uk">UK</button>
    <button class="ctl lang" data-lang="de" lang="de">DE</button>
  </div>
</header>

<section class="stats" id="stats"></section>

<div class="banner" id="llmBanner" role="status" hidden>
  <span class="bt" id="llmBannerText"></span>
  <span class="bb">
    <button class="btn small" id="llmBannerPause"></button>
    <button class="iconbtn" id="llmBannerClose" data-i18n-aria="banner.close">✕</button>
  </span>
</div>

<main class="layout">
  <div class="stage">
    <div class="canvas-box">
      <div class="canvas-wrap" id="canvasWrap"><canvas id="world" data-i18n-aria="mapLabel"></canvas></div>
      <div class="zoom" role="group">
        <button class="ctl" id="zoomIn" data-i18n-aria="zoomIn">＋</button>
        <button class="ctl" id="zoomOut" data-i18n-aria="zoomOut">－</button>
      </div>
    </div>
    <div class="strip" id="strip" role="listbox" data-i18n-aria="strip"></div>
    <p class="legend">
      <span><i class="lg" style="background:#f1ece2"></i><span data-i18n="lg.rabbit"></span></span>
      <span><i class="lg" style="background:#9a6a3a"></i><span data-i18n="lg.deer"></span></span>
      <span><i class="lg" style="background:#4b4f55"></i><span data-i18n="lg.wolf"></span></span>
      <span><i class="lg" style="background:#b07a43"></i><span data-i18n="lg.dog"></span></span>
      <span><i class="lg dia" style="background:#3fbf8f"></i><span data-i18n="lg.ore"></span></span>
      <span><i class="lg" style="background:#ffcf5a"></i><span data-i18n="lg.exp"></span></span>
      <span class="hint" data-i18n="lg.hint"></span>
    </p>
  </div>

  <aside class="panel">
    <nav class="tabs" role="tablist">
      <button class="tab on" data-tab="chron" role="tab" data-i18n="tab.chron"></button>
      <button class="tab" data-tab="people" role="tab" data-i18n="tab.people"></button>
      <button class="tab" data-tab="disc" role="tab" data-i18n="tab.disc"></button>
      <button class="tab" data-tab="brain" role="tab" data-i18n="tab.brain"></button>
      <button class="tab" data-tab="worlds" role="tab" data-i18n="tab.worlds"></button>
    </nav>

    <div class="pane on" id="pane-chron">
      <div class="chips" id="chronFilter">
        <button class="chip on" data-f="all" data-i18n="f.all"></button>
        <button class="chip" data-f="discovery" data-i18n="f.discovery"></button>
        <button class="chip" data-f="idea" data-i18n="f.idea"></button>
        <button class="chip" data-f="together" data-i18n="f.together"></button>
        <button class="chip" data-f="talk" data-i18n="f.talk"></button>
        <button class="chip" data-f="life" data-i18n="f.life"></button>
      </div>
      <ol class="chron" id="chron"></ol>
    </div>

    <div class="pane" id="pane-people">
      <div id="person"></div>
      <ul class="people" id="people"></ul>
    </div>

    <div class="pane" id="pane-disc">
      <div id="disc"></div>
    </div>

    <div class="pane" id="pane-brain">
      <section class="card">
        <h2 data-i18n="llm.title"></h2>
        <p class="muted" data-i18n="llm.intro"></p>
        <div class="presets" role="group">
          <button class="preset" data-preset="cloudflare"><b>Cloudflare</b><span data-i18n="p.cf"></span></button>
          <button class="preset" data-preset="openrouter"><b>OpenRouter</b><span data-i18n="p.or"></span></button>

<script>
/* ============================================================
   Мови / Sprachen: українська (uk) і німецька (de)
   Симуляція зберігає повідомлення як [ключ, параметри],
   тож уся хроніка перекладається одразу при перемиканні мови.
   ============================================================ */
(function (V) {
  'use strict';

  let lang = 'uk';
  try { lang = localStorage.getItem('valley.lang') || (/^de/i.test(navigator.language || '') ? 'de' : 'uk'); } catch (e) { /* без сховища */ }
  if (lang !== 'uk' && lang !== 'de') lang = 'uk';
  Object.defineProperty(V, 'lang', { get: () => lang });
  V.setLang = function (l) { lang = l === 'de' ? 'de' : 'uk'; try { localStorage.setItem('valley.lang', lang); } catch (e) { /* ок */ } };

  /* ---------- Імена ---------- */
  const NAME_DE = {
    'Олеся': 'Olesja', 'Тарас': 'Taras', 'Мирослава': 'Myroslawa', 'Богдан': 'Bohdan', 'Ярина': 'Jaryna', 'Остап': 'Ostap',
    'Злата': 'Slata', 'Данило': 'Danylo', 'Леся': 'Lesja', 'Назар': 'Nasar', 'Устина': 'Ustyna', 'Орест': 'Orest',
    'Марта': 'Marta', 'Ілько': 'Ilko', 'Соломія': 'Solomija', 'Захар': 'Sachar', 'Олекса': 'Oleksa', 'Дарина': 'Daryna',
    'Роман': 'Roman', 'Христя': 'Chrystja', 'Іванна': 'Iwanna', 'Святослав': 'Swjatoslaw', 'Галя': 'Halja', 'Петро': 'Petro',
    'Віра': 'Wira', 'Гнат': 'Hnat',
  };
  const FEMALE = new Set(['Олеся', 'Мирослава', 'Ярина', 'Злата', 'Леся', 'Устина', 'Марта', 'Соломія', 'Дарина', 'Христя', 'Іванна', 'Галя', 'Віра']);
  V.isFemale = name => FEMALE.has(name);
  V.nn = function (name) {
    if (!name) return '';
    if (lang === 'de') { if (NAME_DE[name]) return NAME_DE[name]; const m = /^Мешканець (\d+)$/.exec(name); if (m) return 'Bewohner ' + m[1]; }
    return name;
  };

  /* ---------- Довідники ---------- */
  const MAT_DE = {
    wood: 'Holz', fiber: 'Pflanzenfaser', resin: 'Harz', stone: 'Stein', flint: 'Feuerstein', clay: 'Ton', sand: 'Sand',
    limestone: 'Kalkstein', salt: 'Salz', water: 'Wasser', copper_ore: 'Kupfererz (Malachit)', tin_ore: 'Zinnerz (Kassiterit)',
    lead_ore: 'Bleierz (Galenit)', iron_ore: 'Eisenerz (Hämatit)', coal: 'Steinkohle', berries: 'Beeren', meat: 'rohes Fleisch',
    fish: 'Fisch', hide: 'Fell', bone: 'Knochen', cooked: 'gekochtes Essen', charcoal: 'Holzkohle', ceramic: 'Keramik',
    brick: 'gebrannter Ziegel', quicklime: 'Branntkalk', mortar: 'Kalkteig', leather: 'gegerbtes Leder', copper: 'Kupfer',
    tin: 'Zinn', lead: 'Blei', iron: 'Eisen (Luppe)', glass: 'Glas', carbon: 'Kohlenstoff',
  };
  const IDEA_DE = {
    knife: ['Schneidwerkzeug', 'schneiden', 'sammelt schneller und verarbeitet Beute besser'],
    spear: ['Speer', 'jagen', 'Jagd gelingt öfter'],
    vessel: ['Gefäß', 'kochen', 'Gekochtes nährt mehr, man kann Wasser tragen'],
    kiln: ['Ofen', 'die Glut halten', 'Glut ohne Luft und +150 °C'],
    bellows: ['Blasebalg', 'Luft blasen', '+300 °C im Ofen'],
    net: ['Netz', 'fischen', 'Fischfang'],
    raft: ['Floß', 'schwimmen', 'doppelter Fischfang, ferne Ufer'],
    cart: ['Karren', 'transportieren', 'trägt doppelt so viel'],

  };
  const SLOT_DE = {
    edge: 'Klinge', point: 'Spitze', shaft: 'Griff', binding: 'Bindung', vessel: 'Gefäß', wall: 'Wand', membrane: 'Membran',
    frame: 'Rahmen', float: 'Schwimmkörper', disc: 'Scheibe', binder: 'Bindemittel', lens: 'Linse', writable: 'Tafel',
    electrode: 'Elektrode', electrolyte: 'Elektrolyt',
  };
  const LAW_DE = {
    cook: 'Eiweiße denaturieren durch Hitze — das Essen wird nahrhafter',
    cookfish: 'Hitze macht Fisch sicherer und nahrhafter',
    char: 'Pyrolyse: ohne Luft verbrennt Holz nicht, sondern verkohlt',
    ceramic: 'Sintern: Tonteilchen verwachsen und werden wasserdicht',
    brick: 'Sand verringert die Schwindung, Sintern ergibt hitzefeste Ziegel',
    lime: 'Kalzinierung: CaCO₃ → CaO + CO₂',
    mortar: 'Kalklöschen: CaO + H₂O → Ca(OH)₂, das an der Luft aushärtet',
    leather: 'Salz entzieht Feuchtigkeit und stoppt die Fäulnis — das Fell wird dicht und haltbar',
    pb: 'Kohlenstoff entzieht dem Erz Schwefel und Sauerstoff, übrig bleibt Blei',
    sn: 'SnO₂ + 2C → Sn + 2CO',
    cu: 'Kohlenstoff reduziert Kupfer aus Malachit, und es schmilzt',
    fe: 'Fe₂O₃ + 3CO → 2Fe + 3CO₂ im Rennofen',
    glass: 'Kalk senkt den Schmelzpunkt von Quarz — es entsteht Glas',
  };
  const REAL_DE = [
    ['Niedrigzinnbronze', 'frühe Bronze: etwas härter als Kupfer, gut schmiedbar'],
    ['Bronze', 'klassische Zinnbronze der Bronzezeit — hart und zäh'],
    ['Glockenbronze', 'sehr hart und klangvoll, aber spröde — daraus goss man Glocken'],
    ['Speculum', 'Spiegelbronze: so hart und glänzend, dass man daraus Spiegel und Teleskope machte'],
    ['Pewter (Zinngeschirr)', 'Zinnlegierung für Geschirr — weich und leicht schmelzbar'],
    ['Zinn-Blei-Lot', 'schmilzt tiefer als beide Metalle — damit verbindet man andere Metalle'],

    ['Schmiedeeisen', 'fast reines Eisen: zäh, aber eher weich'],
    ['Weicher Stahl', 'kohlenstoffarmer Stahl — fest und gut formbar'],
    ['Kohlenstoffstahl', 'harter Stahl, der eine Schneide gut hält'],
    ['Gusseisen', 'viel Kohlenstoff: leicht schmelzbar, hart, aber spröde'],
    ['Strohlehm', 'mit Stroh bewehrter Lehm — Baustoff seit Jahrtausenden'],
    ['Gemagerter Ton', 'Ton mit Sand reißt beim Trocknen weniger'],
    ['Kalkmörtel', 'Kalk mit Sand — der klassische Baumörtel'],
    ['Opus signinum', 'Kalk mit zerstoßener Keramik — wasserfester römischer Mörtel'],
    ['Harzkleber', 'Harz mit Kohle — uralter Kleber zum Befestigen von Spitzen'],
  ];
  const ERA = {
    uk: { stone: 'Кам\'яна доба', ceramic: 'Доба кераміки', copper: 'Мідна доба', bronze: 'Бронзова доба', iron: 'Залізна доба', glass: 'Доба скла й заліза', electric: 'Електрична доба' },
    de: { stone: 'Steinzeit', ceramic: 'Keramikzeit', copper: 'Kupferzeit', bronze: 'Bronzezeit', iron: 'Eisenzeit', glass: 'Zeit von Glas und Eisen', electric: 'Elektrisches Zeitalter' },
  };
  const ERA_SHORT = {
    uk: { stone: 'Камінь', ceramic: 'Кераміка', copper: 'Мідь', bronze: 'Бронза', iron: 'Залізо', glass: 'Скло', electric: 'Електрика' },
    de: { stone: 'Stein', ceramic: 'Keramik', copper: 'Kupfer', bronze: 'Bronze', iron: 'Eisen', glass: 'Glas', electric: 'Strom' },
  };
  V.ERA_KEYS = ['stone', 'ceramic', 'copper', 'bronze', 'iron', 'glass', 'electric'];
  V.eraName = k => ERA[lang][k] || k;
  V.eraShort = k => ERA_SHORT[lang][k] || k;
  const ACT = {
    uk: { gather: 'збирає', hunt: 'полює', fish: 'рибалить', experiment: 'експериментує', teach: 'навчає', build: 'будує', explore: 'досліджує', feed: 'годує тварин', eat: 'їсть', sleep: 'спить', listen: 'слухає', play: 'грається', think: 'обмірковує' },
    de: { gather: 'sammelt', hunt: 'jagt', fish: 'fischt', experiment: 'experimentiert', teach: 'lehrt', build: 'baut', explore: 'erkundet', feed: 'füttert Tiere', eat: 'isst', sleep: 'schläft', listen: 'hört zu', play: 'spielt', think: 'denkt nach' },
  };
  V.act = t => ACT[lang][t] || t;
  const ANIMAL = { uk: { rabbit: 'кріль', deer: 'олень', wolf: 'вовк', dog: 'собака' }, de: { rabbit: 'Kaninchen', deer: 'Hirsch', wolf: 'Wolf', dog: 'Hund' } };
  V.animalName = t => ANIMAL[lang][t] || t;
  const KIND = {
    uk: { organic: 'органіка', mineral: 'мінерал', ore: 'руда', fuel: 'паливо', food: 'їжа', liquid: 'рідина', ceramic: 'кераміка', metal: 'метал', composite: 'композит', alloy: 'сплав' },
    de: { organic: 'organisch', mineral: 'Mineral', ore: 'Erz', fuel: 'Brennstoff', food: 'Nahrung', liquid: 'Flüssigkeit', ceramic: 'Keramik', metal: 'Metall', composite: 'Verbundstoff', alloy: 'Legierung' },
  };
  V.kindName = k => KIND[lang][k] || k;

  /* Час у форматі мови: «завтра о 01:00» / «morgen um 01:00» */
  V.fmtTime = function (ms) {
    if (!ms) return '';
    const d = new Date(ms), now = new Date();
    const hm = d.toLocaleTimeString(lang === 'de' ? 'de-DE' : 'uk-UA', { hour: '2-digit', minute: '2-digit' });
    const tomorrow = d.toDateString() !== now.toDateString();
    return lang === 'de' ? (tomorrow ? `morgen um ${hm}` : `um ${hm}`) : (tomorrow ? `завтра о ${hm}` : `о ${hm}`);
  };

  /* Назва матеріалу з урахуванням мови */
  V.mn = function (id) {
    const M = V.MATERIALS, m = M && M[id];
    if (id === 'carbon') return lang === 'de' ? 'Kohlenstoff' : 'вуглець';
    if (!m) return id;
    let base;
    if (m.realIdx != null) base = lang === 'de' ? REAL_DE[m.realIdx][0] : V.REAL[m.realIdx].name;
    else if (m.word) base = V.wordName(m.word);     // вигадане слово, записане складами
    else if (m.inventor) base = m.name;            // назва, яку дала модель
    else base = lang === 'de' ? (MAT_DE[id] || m.name) : m.name;
    return m.withComp ? `${base} (${V.describeComp(m.comp)})` : base;
  };
  const SYL = { uk: ['ва', 'ре', 'лі', 'то', 'мі', 'ар', 'ко', 'ні', 'ус', 'да', 'ле', 'ри', 'са', 'ту', 'ен', 'ор', 'ві', 'ла', 'мо', 'зе'],
    de: ['wa', 're', 'li', 'to', 'mi', 'ar', 'ko', 'ni', 'us', 'da', 'le', 'ri', 'sa', 'tu', 'en', 'or', 'wi', 'la', 'mo', 'se'] };
  V.SYL_COUNT = 20;
  V.wordName = idx => { const w = idx.map(k => SYL[lang][k]).join(''); return w.charAt(0).toUpperCase() + w.slice(1); };
  V.ideaName = id => lang === 'de' ? IDEA_DE[id][0] : V.IDEAS[id].name;
  V.ideaVerb = id => lang === 'de' ? IDEA_DE[id][1] : V.IDEAS[id].verb;
  V.ideaEffect = id => lang === 'de' ? IDEA_DE[id][2] : V.IDEAS[id].effect;
  V.slotName = id => lang === 'de' ? SLOT_DE[id] : V.SLOT[id].name;
  V.lawWhy = id => { const l = V.LAWS.find(x => x.id === id); return lang === 'de' ? LAW_DE[id] : (l ? l.why : ''); };
  V.realNote = idx => lang === 'de' ? REAL_DE[idx][1] : V.REAL[idx].note;

  V.describeComp = function (comp) {
    const fine = comp.some(([, f]) => f < 0.01 || f > 0.99);
    return comp.map(([id, f]) => `${(f * 100).toFixed(fine ? 1 : 0)}% ${V.mn(id)}`).join(' + ');
  };
  V.propLine = function (p) {
    const de = lang === 'de', parts = [];
    parts.push(`${de ? 'Härte' : 'твердість'} ${(+p.hard).toFixed(1)}`);
    parts.push(`${de ? 'Zähigkeit' : 'міцність'} ${(+p.tough).toFixed(1)}`);
    if (p.flex > 2) parts.push(`${de ? 'Biegsamkeit' : 'гнучкість'} ${(+p.flex).toFixed(1)}`);
    parts.push(`${de ? 'Dichte' : 'густина'} ${(+p.dens).toFixed(1)} ${de ? 'g/cm³' : 'г/см³'}`);
    if (p.mp) parts.push(de ? `schmilzt bei ~${Math.round(p.mp)} °C` : `плавиться ~${Math.round(p.mp)}°C`);
    else if (p.hp) parts.push(de ? `hält ~${Math.round(p.hp)} °C aus` : `витримує ~${Math.round(p.hp)}°C`);

    return parts.join(', ');
  };
  /* Опис створеного матеріалу */

    if (!m || !m.inventor) return m && lang === 'uk' ? (m.desc || '') : '';

      ? `Neuartig: ${m.alloy ? 'Legierung' : 'Verbundstoff'} aus ${V.describeComp(m.comp)}. In der realen Welt hat er keinen eigenen Namen. Am ähnlichsten in den Eigenschaften: ${near}.`
      : `Нового типу: ${m.alloy ? 'сплав' : 'композит'} ${V.describeComp(m.comp)}. У реальному світі окремої назви не має. Найближчий за властивостями: ${near}.`;
  };
  V.devName = function (d) {
    if (!d) return '';

  V.knowName = function (k) {
    const id = k.slice(2), de = lang === 'de';

    if (k.startsWith('i:')) return (de ? 'Idee: ' : 'ідея: ') + V.ideaName(id);
    if (k.startsWith('l:')) { const l = V.LAWS.find(x => x.id === id); return l ? (de ? 'Gesetz: ' : 'закон: ') + l.inputs.map(V.mn).join('+') + ' → ' + V.mn(l.out) : id; }

  };

  /* ---------- Тексти ---------- */
  // Параметри: n, n2, n3 — імена; m, m2 — id матеріалів; ms — масив id; idea, slot, law, era — ключі;

  const UK = {
    'raw': r => r.s,
    'log.start': 'Вісім поселенців розклали багаття в долині. Вони вміють розводити вогонь — і більше нічого.',

    'why.kiln': 'треба загородити вогонь, щоб жар не розходився.',

    'why.raft': 'деревина тримається на воді… а людина на ній?',
    'why.cart': 'носити все в руках — надто повільно.',

<script>
/* ============================================================
   Долина винахідників — «закони природи»
   Властивості матеріалів, закони нагрівання, генератор
   сплавів і композитів, реальний каталог матеріалів,
   ідеї пристроїв і перевірка їхньої роботи.
   NPC цих таблиць не бачать: вони лише пробують, а світ відповідає.
   ============================================================ */
(function (V) {
  'use strict';

  const clamp = (x, a = 0, b = 1.5) => Math.max(a, Math.min(b, x));
  V.clamp = clamp;

  /* ---------- Матеріали ----------
     hard  твердість (0–10, приблизно за Моосом)
     tough міцність / ударна в'язкість (0–10)
     flex  гнучкість (0–10)       tensile міцність на розрив (0–10)
     dens  густина, г/см³          wp   водонепроникність (0–1)
     hp    жаростійкість, °C       mp   температура плавлення (метали), °C
     fuel  макс. температура полум'я, °C
     sharp здатність тримати гостре лезо (0–1)
     trans прозорість  cond електропровідність  pot електродний потенціал, В
     ion   іонна провідність (електроліт)        food поживність
     plast пластичність  air герметичність  binder в'язучі властивості
  */
  const M = {};
  function mat(id, name, kind, props, extra = {}) {
    M[id] = Object.assign({
      id, name, kind,
      hard: 0, tough: 0, flex: 0, tensile: 0, dens: 1, wp: 0, hp: 300, mp: 0, fuel: 0,
      sharp: 0, trans: 0, cond: 0, pot: 0, ion: 0, food: 0, plast: 0, air: 0, binder: 0,
    }, props, extra);
  }

  // природні
  mat('wood', 'деревина', 'organic', { hard: 3, tough: 6, flex: 4, tensile: 5, dens: 0.7, wp: 0.4, hp: 250, fuel: 600, sharp: 0.2 }, { color: '#9a6b3c' });
  mat('fiber', 'рослинне волокно', 'organic', { hard: 0.5, tough: 2, flex: 9, tensile: 6, dens: 0.5, wp: 0.1, hp: 200 }, { color: '#b9c46a' });
  mat('resin', 'смола', 'organic', { hard: 1, tough: 2, flex: 3, tensile: 2, dens: 1.05, wp: 1, hp: 150, plast: 7, binder: 0.6 }, { color: '#c98a2e' });
  mat('stone', 'камінь', 'mineral', { hard: 6, tough: 3, dens: 2.6, wp: 1, hp: 1200, sharp: 0.4 }, { color: '#8d8a86' });
  mat('flint', 'кремінь', 'mineral', { hard: 7, tough: 2, dens: 2.6, wp: 1, hp: 1000, sharp: 1 }, { color: '#4f5560' });
  mat('clay', 'глина', 'mineral', { hard: 1, tough: 1, dens: 1.8, wp: 0.3, hp: 600, plast: 9, binder: 0.4 }, { color: '#b5734f' });
  mat('sand', 'пісок', 'mineral', { hard: 6, tough: 0.5, dens: 1.6, hp: 1700 }, { color: '#dcc68d' });
  mat('limestone', 'вапняк', 'mineral', { hard: 3, tough: 2, dens: 2.5, wp: 0.8, hp: 800 }, { color: '#d8d4c4' });
  mat('salt', 'сіль', 'mineral', { hard: 2, tough: 0.5, dens: 2.2, ion: 1 }, { color: '#eef0f2' });
  mat('water', 'вода', 'liquid', { dens: 1, ion: 0.1, hp: 100 }, { color: '#4a8fc4' });
  mat('copper_ore', 'мідна руда (малахіт)', 'ore', { hard: 4, tough: 2, dens: 4, hp: 1000 }, { color: '#3e9b7a' });
  mat('tin_ore', 'олов\'яна руда (каситерит)', 'ore', { hard: 6, tough: 2, dens: 7, hp: 1100 }, { color: '#5b4a3e' });
  mat('lead_ore', 'свинцева руда (галеніт)', 'ore', { hard: 2.5, tough: 2, dens: 7.5, hp: 1000 }, { color: '#7d8590' });
  mat('iron_ore', 'залізна руда (гематит)', 'ore', { hard: 5.5, tough: 2, dens: 5, hp: 1500 }, { color: '#8b3a2a' });
  mat('coal', 'кам\'яне вугілля', 'fuel', { hard: 2, tough: 1, dens: 1.3, fuel: 1200, hp: 300 }, { color: '#2a2a2e' });
  mat('berries', 'ягоди', 'food', { food: 15, dens: 1 }, { color: '#b23a5b' });
  mat('meat', 'сире м\'ясо', 'food', { food: 30, dens: 1 }, { color: '#b5524a' });
  mat('fish', 'риба', 'food', { food: 25, dens: 1 }, { color: '#9fb7c9' });
  mat('hide', 'шкура', 'organic', { hard: 1, tough: 5, flex: 7, tensile: 5, dens: 0.9, wp: 0.6, hp: 120, air: 0.8 }, { color: '#a5835f' });
  mat('bone', 'кістка', 'organic', { hard: 4, tough: 4, dens: 1.9, hp: 600, sharp: 0.9 }, { color: '#e6dcc3' });

  // отримувані законами природи
  mat('cooked', 'приготована їжа', 'food', { food: 55, dens: 1 }, { color: '#c9853f' });
  mat('charcoal', 'деревне вугілля', 'fuel', { hard: 1, tough: 0.5, dens: 0.4, fuel: 1100, hp: 300, cond: 0.3, pot: 0.2 }, { color: '#1f1f22' });
  mat('ceramic', 'кераміка', 'ceramic', { hard: 5, tough: 2.5, dens: 2, wp: 1, hp: 1400, sharp: 0.5 }, { color: '#c46a3c' });
  mat('brick', 'обпалена цегла', 'ceramic', { hard: 5, tough: 3, dens: 1.9, wp: 0.8, hp: 1700, binder: 0 }, { color: '#a3462e' });
  mat('quicklime', 'негашене вапно', 'mineral', { hard: 2, tough: 0.5, dens: 3.3, ion: 0.5, hp: 2500 }, { color: '#f4f2ea' });
  mat('mortar', 'вапняне тісто', 'mineral', { hard: 4, tough: 2, dens: 1.8, wp: 0.7, hp: 900, binder: 1, plast: 6 }, { color: '#e3dfd0' });
  mat('leather', 'вичинена шкіра', 'organic', { hard: 1.5, tough: 7, flex: 6, tensile: 7, dens: 0.9, wp: 0.8, hp: 150, air: 1 }, { color: '#7a4f2e' });
  mat('copper', 'мідь', 'metal', { hard: 3, tough: 7, flex: 2, tensile: 6, dens: 8.9, wp: 1, mp: 1085, hp: 985, sharp: 0.8, cond: 1, pot: 0.34 }, { color: '#c8733c' });
  mat('tin', 'олово', 'metal', { hard: 1.5, tough: 4, flex: 3, tensile: 2, dens: 7.3, wp: 1, mp: 232, hp: 200, sharp: 0.3, cond: 1, pot: -0.14 }, { color: '#c9ccd1' });
  mat('lead', 'свинець', 'metal', { hard: 1, tough: 4, flex: 4, tensile: 1.5, dens: 11.3, wp: 1, mp: 327, hp: 300, sharp: 0.2, cond: 1, pot: -0.13 }, { color: '#6f7783' });
  mat('iron', 'залізо (криця)', 'metal', { hard: 5, tough: 7, flex: 1, tensile: 7, dens: 7.9, wp: 0.7, mp: 1538, hp: 1400, sharp: 0.9, cond: 1, pot: -0.44 }, { color: '#5c6168' });
  mat('glass', 'скло', 'ceramic', { hard: 5.5, tough: 1, dens: 2.5, wp: 1, hp: 1000, sharp: 0.9, trans: 1 }, { color: '#9fd3d6' });

  V.MATERIALS = M;
  V.BASE_RESOURCES = ['wood', 'fiber', 'resin', 'stone', 'flint', 'clay', 'sand', 'limestone', 'salt', 'water',
    'copper_ore', 'tin_ore', 'lead_ore', 'iron_ore', 'coal', 'berries'];
  V.FUELS = ['wood', 'charcoal', 'coal'];

  /* ---------- Закони нагрівання та змішування ---------- */
  // inputs — точний набір; reducer — будь-який відновник з переліку
  V.LAWS = [
    { id: 'cook', inputs: ['meat'], minT: 150, out: 'cooked', why: 'білки денатурують під дією тепла — їжа стає поживнішою' },
    { id: 'cookfish', inputs: ['fish'], minT: 150, out: 'cooked', why: 'тепло робить рибу безпечнішою і поживнішою' },
    { id: 'char', inputs: ['wood'], minT: 400, enclosed: true, out: 'charcoal', why: 'піроліз: без доступу повітря деревина не згоряє, а обвуглюється' },
    { id: 'ceramic', inputs: ['clay'], minT: 800, out: 'ceramic', why: 'спікання: частинки глини зростаються і стають водонепроникними' },
    { id: 'brick', inputs: ['clay', 'sand'], minT: 900, out: 'brick', why: 'пісок зменшує усадку, а спікання дає жаростійку цеглу' },
    { id: 'lime', inputs: ['limestone'], minT: 900, out: 'quicklime', why: 'кальцинація: CaCO₃ → CaO + CO₂' },
    { id: 'mortar', inputs: ['quicklime', 'water'], minT: 0, out: 'mortar', why: 'гасіння вапна: CaO + H₂O → Ca(OH)₂, яке твердне на повітрі' },
    { id: 'leather', inputs: ['hide', 'salt'], minT: 0, out: 'leather', why: 'сіль витягує вологу і зупиняє гниття — шкіра стає щільною і довговічною' },
    { id: 'pb', inputs: ['lead_ore'], reducer: true, minT: 800, out: 'lead', why: 'вуглець відбирає сірку й кисень у руди, лишається свинець' },
    { id: 'sn', inputs: ['tin_ore'], reducer: true, minT: 900, out: 'tin', why: 'SnO₂ + 2C → Sn + 2CO' },
    { id: 'cu', inputs: ['copper_ore'], reducer: true, minT: 1085, out: 'copper', why: 'вуглець відновлює мідь з малахіту, і вона плавиться' },
    { id: 'fe', inputs: ['iron_ore'], reducer: true, minT: 1300, out: 'iron', why: 'Fe₂O₃ + 3CO → 2Fe + 3CO₂ у сиродутному горні' },
    { id: 'glass', inputs: ['sand', 'quicklime'], minT: 1400, out: 'glass', why: 'вапно знижує температуру плавлення кварцу — утворюється скло' },
  ];
  const REDUCERS = ['charcoal', 'coal'];

  const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));

  /* Нагрівання: inputs — масив id; повертає результат і «спостереження» */
  V.heat = function (inputs, temp, enclosed) {
    const plain = inputs.filter(x => !REDUCERS.includes(x));
    const hasReducer = inputs.some(x => REDUCERS.includes(x));
    for (const law of V.LAWS) {
      if (!sameSet(law.inputs, plain)) continue;
      if (law.reducer && !hasReducer) {
        if (temp >= law.minT) return { ok: false, hint: 'nothing', note: ['heat.ore', {}] };
        continue;
      }
      if (!law.reducer && hasReducer && plain.length === inputs.length - 1 && law.id !== 'char') {
        // зайве вугілля не заважає, просто згорає
      }
      if (law.enclosed && !enclosed) return { ok: false, hint: 'air', law: law.id, note: ['heat.air', {}] };
      if (temp < law.minT) return { ok: false, hint: 'hotter', law: law.id, need: law.minT, note: ['heat.hotter', { t: Math.round(temp) }] };
      return { ok: true, out: law.out, law: law.id, why: law.why };
    }
    // фізична реакція без нового матеріалу
    const m = M[plain[0]];
    if (m && m.mp && temp >= m.mp) return { ok: false, hint: 'melt', note: ['heat.melt', { m: m.id }] };
    if (m && m.fuel) return { ok: false, hint: 'burn', note: ['heat.burn', { m: m.id }] };
    return { ok: false, hint: 'nothing', note: ['heat.nothing', {}] };
  };

  /* ---------- Генератор сплавів і композитів ---------- */
  // парні коефіцієнти: зміцнення (H), крихкість (B), зниження Tпл (D)
  const PAIR = {
    'copper|tin': { H: 4.2, B: 18, D: 260 },
    'copper|lead': { H: 0.6, B: 6, D: 120 },
    'lead|tin': { H: 0.9, B: 2, D: 420 },
    'copper|iron': { H: 2.5, B: 10, D: 90 },
    'iron|tin': { H: 1.5, B: 22, D: 300 },
    'iron|lead': { H: 0.2, B: 12, D: 40 },
  };
  const pairKey = (a, b) => [a, b].sort().join('|');

  /* Сплав: base — основний метал, add — добавка ('charcoal' = вуглець), f — частка добавки */
  V.makeAlloy = function (base, add, f) {
    const A = M[base];
    if (add === 'charcoal') {
      const c = f; // масова частка вуглецю
      return {
        kind: 'alloy', comp: [[base, 1 - c], ['carbon', c]],
        hard: A.hard + Math.min(c, 0.021) * 160 + Math.max(0, c - 0.021) * 40,
        tough: A.tough + Math.min(c, 0.008) * 60 - Math.max(0, c - 0.012) * 190,
        flex: Math.max(0, A.flex - c * 20), tensile: A.tensile + Math.min(c, 0.012) * 120 - Math.max(0, c - 0.02) * 120,
        dens: A.dens - c * 10, wp: A.wp, mp: A.mp - c * 9000, cond: 1, pot: A.pot + c * 2,
        sharp: Math.min(1, A.sharp + c * 8),
      };
    }
    const B = M[add];
    const p = PAIR[pairKey(base, add)] || { H: 2, B: 10, D: 150 };
    const fa = 1 - f, fb = f;
    const minor = Math.min(fa, fb);
    const harden = p.H * (minor / (minor + 0.07));
    const brittle = p.B * Math.max(0, minor - 0.14);
    const out = {
      kind: 'alloy', comp: [[base, fa], [add, fb]],
      hard: fa * A.hard + fb * B.hard + harden,
      tough: fa * A.tough + fb * B.tough - brittle,
      flex: Math.max(0, fa * A.flex + fb * B.flex - harden * 0.5),
      tensile: fa * A.tensile + fb * B.tensile + harden * 0.6 - brittle * 0.8,
      dens: fa * A.dens + fb * B.dens,
      wp: Math.min(A.wp, B.wp) * 0.5 + (fa * A.wp + fb * B.wp) * 0.5,
      mp: fa * A.mp + fb * B.mp - p.D * 4 * fa * fb,
      cond: 1, pot: fa * A.pot + fb * B.pot,
      sharp: Math.min(1, fa * A.sharp + fb * B.sharp + harden * 0.05),
    };
    return out;
  };

  V.MATRICES = ['clay', 'mortar', 'resin'];
  V.FILLERS = ['fiber', 'sand', 'bone', 'ceramic', 'charcoal', 'hide', 'stone'];

  /* Композит: основа (matrix) + наповнювач (filler) з часткою f */
  V.makeComposite = function (matrix, filler, f) {
    const A = M[matrix], B = M[filler];
    const fa = 1 - f, fb = f;
    const fibrous = clamp((B.tensile * B.flex) / 40, 0, 1.4); // волокна армують
    const grit = clamp(B.hard / 6, 0, 1.2) * (1 - fibrous);   // тверді частинки
    const bond = A.binder;
    const overload = Math.max(0, fb - 0.45) * 8; // забагато наповнювача — розсипається
    return {
      kind: 'composite', comp: [[matrix, fa], [filler, fb]],
      hard: fa * A.hard + fb * B.hard * bond * 0.8 + grit * fb * 2 - overload,
      tough: fa * A.tough + fibrous * fb * 9 * bond + fb * B.tough * 0.2 - overload * 1.5,
      flex: fa * A.flex + fibrous * fb * 3,
      tensile: fa * A.tensile + fibrous * fb * 8 * bond - overload,
      dens: fa * A.dens + fb * B.dens,
      wp: clamp(fa * A.wp + fb * B.wp * 0.5 - overload * 0.1, 0, 1),
      hp: Math.min(A.hp + fb * (B.hp - A.hp) * 0.6, Math.max(A.hp, B.hp)),
      plast: A.plast * fa, binder: A.binder * fa,
      cond: B.cond * fb, pot: B.pot, sharp: fb * B.sharp * 0.5,
      ion: 0, air: fa * A.air,
    };
  };

  // перевіряється за складом; якщо збіг — матеріал отримує справжню назву
  V.REAL = [
    { comp: ['copper', 'tin'], minor: 'tin', from: 0.02, to: 0.075, name: 'Низькоолов\'яна бронза', note: 'рання бронза: трохи твердіша за мідь, легко кується' },
    { comp: ['copper', 'tin'], minor: 'tin', from: 0.075, to: 0.155, name: 'Бронза', note: 'класична олов\'яна бронза бронзової доби — тверда і в\'язка' },
    { comp: ['copper', 'tin'], minor: 'tin', from: 0.155, to: 0.25, name: 'Дзвонова бронза', note: 'дуже тверда, дзвінка, але крихка — з неї відливали дзвони' },

    { comp: ['tin', 'lead'], minor: 'lead', from: 0.3, to: 0.46, name: 'Олов\'яно-свинцевий припій', note: 'плавиться нижче за обидва метали — ним з\'єднують інші метали' },
    { comp: ['tin', 'lead'], minor: 'lead', from: 0.05, to: 0.3, name: 'Свинцевий п\'ютер', note: 'дешевий олов\'яний сплав зі свинцем' },
    { comp: ['lead', 'tin'], minor: 'tin', from: 0.02, to: 0.5, name: 'Свинцево-олов\'яний сплав', note: 'важкий м\'який сплав для грузил і труб' },
    { comp: ['iron', 'carbon'], minor: 'carbon', from: 0, to: 0.0025, name: 'Ковке залізо', note: 'майже чисте залізо: в\'язке, але м\'якувате' },

    { comp: ['iron', 'carbon'], minor: 'carbon', from: 0.006, to: 0.021, name: 'Вуглецева сталь', note: 'тверда сталь, що добре тримає лезо' },

    { comp: ['mortar', 'sand'], minor: 'sand', from: 0.2, to: 0.65, name: 'Вапняний розчин', note: 'вапно з піском — класичний будівельний розчин' },
    { comp: ['mortar', 'ceramic'], minor: 'ceramic', from: 0.15, to: 0.55, name: 'Цем\'янка', note: 'вапно з товченою керамікою (opus signinum) — водостійкий римський розчин' },
    { comp: ['resin', 'charcoal'], minor: 'charcoal', from: 0.08, to: 0.45, name: 'Смоляний клей', note: 'смола з вугіллям — давній клей для кріплення наконечників' },

  V.matchReal = function (comp) {

  V.nearest = function (p, pool) {

    let best = null, bd = 1e9;
    for (const m of pool) {
      if (!m || m.kind === 'food' || m.kind === 'liquid' || m.kind === 'ore') continue;
      let d = 0;
      for (const k of keys) d += Math.pow((p[k] || 0) - (m[k] || 0), 2);

  /* ---------- Ідеї пристроїв ----------
     Кожна ідея — фізичний принцип із «гніздами».

     Пристрій працює, якщо всі гнізда ≥ 0.6. */
  const SLOT = {
    edge: { name: 'лезо', test: p => clamp((p.hard - 3) / 4) * clamp(p.tough / 3, 0, 1) * clamp(p.sharp * 1.1, 0, 1) },
    point: { name: 'вістря', test: p => clamp((p.hard - 2) / 3.5) * clamp(p.sharp * 1.2, 0, 1) * clamp(p.tough / 1.5, 0, 1) },
    shaft: { name: 'держак', test: p => clamp(p.tough / 5) * clamp((3 - p.dens) / 2, 0, 1) * clamp(p.hard / 2, 0, 1) * clamp((7 - p.flex) / 3, 0, 1) },
    binding: { name: 'обмотка', test: p => clamp(p.tensile / 5) * clamp(p.flex / 6) },
    vessel: { name: 'посудина', test: p => clamp(p.wp, 0, 1) * clamp(p.hp / 400) * clamp(p.hard / 3, 0, 1) * clamp(p.tough / 1.5, 0, 1) },
    wall: { name: 'стіна', test: p => clamp(p.hp / 1000) * clamp(p.hard / 3, 0, 1) * clamp(p.tough / 1.5, 0, 1) },
    membrane: { name: 'мембрана', test: p => clamp(p.air, 0, 1) * clamp(p.flex / 5) * clamp(p.tough / 4, 0, 1) },
    frame: { name: 'каркас', test: p => clamp(p.tough / 4) * clamp(p.hard / 2, 0, 1) * clamp((4 - p.dens) / 2, 0, 1) },
    float: { name: 'поплавок', test: p => clamp((1.15 - p.dens) / 0.5) * clamp(p.tough / 3, 0, 1) * clamp(p.hard / 2, 0, 1) },
    disc: { name: 'диск', test: p => clamp(p.tough / 5) * clamp(p.hard / 3, 0, 1) },
    binder: { name: 'в\'яжуче', test: p => clamp(p.binder * 1.1) * clamp(p.hard / 2, 0, 1) },
    lens: { name: 'лінза', test: p => clamp(p.trans, 0, 1) * clamp(p.hard / 5) },
    writable: { name: 'табличка', test: p => clamp(p.plast / 6) * clamp(p.dens / 1.5, 0, 1) },
    electrode: { name: 'електрод', test: p => p.cond >= 0.9 ? 1 : p.cond * 0.5 },
    electrolyte: { name: 'електроліт', test: p => clamp(p.ion / 0.8) },
  };
  V.SLOT = SLOT;

  V.IDEAS = {
    knife: { name: 'ріжучий інструмент', verb: 'різати', slots: ['edge', 'shaft', 'binding'], effect: 'швидше збирає і краще оброблює здобич' },
    spear: { name: 'спис', verb: 'полювати', slots: ['point', 'shaft', 'binding'], effect: 'полювання вдається частіше' },
    vessel: { name: 'посудина', verb: 'варити', slots: ['vessel'], effect: 'варене дає більше поживності, можна носити воду' },
    kiln: { name: 'піч', verb: 'тримати жар', slots: ['wall'], structure: true, effect: 'жар без повітря і +150°C' },
    bellows: { name: 'міхи', verb: 'дмухати', slots: ['membrane', 'frame'], structure: true, effect: '+300°C у печі' },
    net: { name: 'сітка', verb: 'ловити рибу', slots: ['binding'], effect: 'рибалка' },
    raft: { name: 'пліт', verb: 'плавати', slots: ['float', 'binding'], effect: 'рибалка вдвічі кориснішa, далекі береги' },
    cart: { name: 'візок', verb: 'возити', slots: ['disc', 'shaft'], effect: 'носить удвічі більше' },
    pen: { name: 'загорода', verb: 'приручати', slots: ['shaft', 'binding'], structure: true, effect: 'приручені тварини дають їжу' },
    house: { name: 'дім', verb: 'жити в теплі', slots: ['wall', 'binder'], structure: true, effect: 'кращий сон і здоров\'я' },
    lens: { name: 'лінза', verb: 'роздивлятися', slots: ['lens'], effect: 'експерименти на 40% швидші' },
    tablet: { name: 'письмові таблички', verb: 'записувати', slots: ['writable', 'point'], structure: true, effect: 'знання з табличок вночі переходять до всіх у таборі' },
    cell: { name: 'гальванічний елемент', verb: 'добувати струм', slots: ['electrode', 'electrode', 'electrolyte', 'vessel'], structure: true, effect: 'електрика: світло в таборі вночі' },
  };

  /* Перевірка пристрою: parts — масив об'єктів-матеріалів у порядку гнізд */
  V.evaluate = function (ideaId, parts) {
    const idea = V.IDEAS[ideaId];
    const scores = idea.slots.map((s, i) => SLOT[s].test(parts[i]));
    let extra = null;
    if (ideaId === 'cell') {
      const a = parts[0], b = parts[1];
      const volts = Math.abs((a.pot || 0) - (b.pot || 0));
      extra = { volts };
      const vs = a.id === b.id ? 0 : clamp(volts / 0.5);
      scores[0] = Math.min(scores[0], vs || 0.01);
      scores[1] = Math.min(scores[1], vs || 0.01);
    }
    const min = Math.min(...scores);
    const q = scores.reduce((s, x) => s + x, 0) / scores.length;
    let weak = idea.slots[scores.indexOf(min)];
    return { works: min >= 0.6, partial: min >= 0.3, quality: +q.toFixed(2), scores, weakSlot: weak, extra };
  };

})(window.V = window.V || {});

<script>
/* ============================================================
   Світ: генерація карти, ресурси, тварини
   ============================================================ */
(function (V) {
  'use strict';

  V.rng = function (seed) {
    let a = seed >>> 0;
    const f = function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    // стан генератора — щоб збережений світ продовжився так само
    f.getState = () => a;
    f.setState = v => { a = v | 0; };
    return f;
  };

  const T = V.TER = { DEEP: 0, SHALLOW: 1, SAND: 2, GRASS: 3, FOREST: 4, HILLS: 5, MOUNT: 6 };

  function valueNoise(rnd, w, h, cell) {
    const gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2;
    const g = [];
    for (let i = 0; i < gw * gh; i++) g.push(rnd());
    const sm = t => t * t * (3 - 2 * t);
    return (x, y) => {
      const gx = x / cell, gy = y / cell;
      const x0 = Math.floor(gx), y0 = Math.floor(gy);
      const fx = sm(gx - x0), fy = sm(gy - y0);
      const v = (i, j) => g[(j) * gw + (i)];
      const a = v(x0, y0) * (1 - fx) + v(x0 + 1, y0) * fx;
      const b = v(x0, y0 + 1) * (1 - fx) + v(x0 + 1, y0 + 1) * fx;
      return a * (1 - fy) + b * fy;
    };
  }

  V.makeWorld = function (seed) {
    const rnd = V.rng(seed);
    const W = 72, H = 48;
    const n1 = valueNoise(rnd, W, H, 14), n2 = valueNoise(rnd, W, H, 6), n3 = valueNoise(rnd, W, H, 3);
    const m1 = valueNoise(rnd, W, H, 10), m2 = valueNoise(rnd, W, H, 4);
    const tiles = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2);
      const fall = Math.pow(Math.min(1, Math.sqrt(dx * dx * 0.9 + dy * dy)), 2.4);
      const e = n1(x, y) * 0.55 + n2(x, y) * 0.3 + n3(x, y) * 0.15 - fall * 0.55 + 0.12;
      const m = m1(x, y) * 0.7 + m2(x, y) * 0.3;
      let t;
      if (e < 0.22) t = T.DEEP;
      else if (e < 0.3) t = T.SHALLOW;
      else if (e < 0.34) t = T.SAND;
      else if (e < 0.56) t = m > 0.5 ? T.FOREST : T.GRASS;
      else if (e < 0.68) t = T.HILLS;
      else t = T.MOUNT;
      tiles.push({ x, y, t, e, r: null, a: 0, max: 0, fish: 0, shade: rnd() });
    }
    const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? null : tiles[y * W + x];
    const near = (x, y, pred, r = 1) => {
      for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
        const t = at(x + i, y + j); if (t && pred(t)) return true;
      }
      return false;
    };
    const isWater = t => t.t <= T.SHALLOW;

    // ресурси
    const put = (t, r, amt) => { t.r = r; t.a = amt; t.max = amt; };
    for (const t of tiles) {
      const p = rnd();
      if (isWater(t)) { t.fish = t.t === T.SHALLOW ? 3 + rnd() * 3 : 2 + rnd() * 4; continue; }
      if (t.t === T.FOREST) { if (p < 0.5) put(t, 'wood', 10); else if (p < 0.6) put(t, 'resin', 4); else if (p < 0.72) put(t, 'berries', 6); }
      else if (t.t === T.GRASS) {
        if (near(t.x, t.y, isWater, 1) && p < 0.35) put(t, 'clay', 12);
        else if (p < 0.16) put(t, 'fiber', 8); else if (p < 0.26) put(t, 'berries', 6);
      } else if (t.t === T.SAND) {
        if (near(t.x, t.y, u => u.t === T.DEEP, 2) && p < 0.18) put(t, 'salt', 6);
        else if (p < 0.5) put(t, 'sand', 15);
        else if (near(t.x, t.y, isWater, 1) && p < 0.6) put(t, 'clay', 10);
      } else if (t.t === T.HILLS) {
        if (p < 0.3) put(t, 'stone', 20); else if (p < 0.42) put(t, 'flint', 8); else if (p < 0.55) put(t, 'limestone', 12);
      } else if (t.t === T.MOUNT) {
        if (p < 0.45) put(t, 'stone', 25);
      }
    }
    // рудні жили — кластери в пагорбах і горах
    const rocky = tiles.filter(t => t.t >= T.HILLS);
    const veins = [['copper_ore', 3, 10], ['tin_ore', 2, 7], ['iron_ore', 3, 12], ['coal', 3, 14], ['lead_ore', 2, 8], ['flint', 1, 8], ['limestone', 1, 10]];
    for (const [r, n, amt] of veins) {
      for (let k = 0; k < n && rocky.length; k++) {
        const c = rocky[Math.floor(rnd() * rocky.length)];
        const size = 2 + Math.floor(rnd() * 3);
        for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
          const t = at(c.x + i, c.y + j);
          if (t && t.t >= T.HILLS && rnd() < 0.3 + size * 0.12) put(t, r, amt);
        }
      }
    }
    // гарантуємо ключові ресурси
    for (const r of ['copper_ore', 'tin_ore', 'iron_ore', 'coal', 'lead_ore', 'salt', 'sand', 'clay', 'flint', 'limestone', 'resin', 'fiber']) {
      if (!tiles.some(t => t.r === r)) {
        const pool = r === 'salt' || r === 'sand' ? tiles.filter(t => t.t === T.SAND) : r === 'clay' || r === 'fiber' ? tiles.filter(t => t.t === T.GRASS) : r === 'resin' ? tiles.filter(t => t.t === T.FOREST) : rocky;
        const pick = pool.length ? pool[Math.floor(rnd() * pool.length)] : tiles.find(t => !isWater(t));
        if (pick) put(pick, r, 10);
      }
    }

    // табір — лука біля води ближче до центру
    let camp = null, best = -1e9;
    for (const t of tiles) {
      if (t.t !== T.GRASS && t.t !== T.SAND) continue;
      const d = Math.hypot(t.x - W / 2, t.y - H / 2);
      let s = -d;
      if (near(t.x, t.y, isWater, 4)) s += 10;
      if (near(t.x, t.y, u => u.t === T.FOREST, 4)) s += 8;
      if (near(t.x, t.y, u => u.t === T.HILLS, 9)) s += 6;
      if (s > best) { best = s; camp = t; }
    }
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) { const t = at(camp.x + i, camp.y + j); if (t && !isWater(t)) { t.r = null; t.a = 0; if (t.t === T.FOREST) t.t = T.GRASS; } }

    return { W, H, tiles, at, near, isWater, camp: { x: camp.x + 0.5, y: camp.y + 0.5 }, rnd };
  };

  V.isLand = (world, x, y) => { const t = world.at(Math.floor(x), Math.floor(y)); return !!t && t.t >= V.TER.SAND && t.t !== V.TER.MOUNT; };
  V.walkable = (world, x, y) => { const t = world.at(Math.floor(x), Math.floor(y)); return !!t && t.t >= V.TER.SAND; };

  /* ---------- Тварини ---------- */
  V.ANIMALS = {
    rabbit: { name: 'кріль', speed: 0.07, cap: 60, breed: 0.0009, prey: true, meat: 2, hide: 1, bone: 0 },
    deer: { name: 'олень', speed: 0.085, cap: 22, breed: 0.0004, prey: true, meat: 5, hide: 2, bone: 2 },
    wolf: { name: 'вовк', speed: 0.1, cap: 8, breed: 0.0003, prey: false },
    dog: { name: 'собака', speed: 0.11, cap: 6, breed: 0.0001, prey: false },
  };
  const isPrey = a => a.type === 'rabbit' || a.type === 'deer';

  /* Суходіл, з'єднаний із табором: тварини з'являються лише тут,
     інакше вовк міг опинитися на острівці без здобичі й загинути */
  V.mainLand = function (world) {
    if (world.main) return world.main;
    const seen = new Set(), q = [[Math.floor(world.camp.x), Math.floor(world.camp.y)]];
    while (q.length) {
      const [x, y] = q.pop(), k = y * world.W + x;
      if (seen.has(k)) continue;
      const t = world.at(x, y);
      if (!t || !V.isLand(world, x + 0.5, y + 0.5)) continue;
      seen.add(k);
      q.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }
    world.main = world.tiles.filter(t => seen.has(t.y * world.W + t.x));
    return world.main;
  };

  V.spawnAnimals = function (sim) {
    const { world, rnd } = sim;
    let land = V.mainLand(world).filter(t => t.t === V.TER.GRASS || t.t === V.TER.FOREST);
    if (land.length < 50) land = world.tiles.filter(t => t.t === V.TER.GRASS || t.t === V.TER.FOREST);
    const add = (type, n) => {
      for (let i = 0; i < n; i++) {
        const t = land[Math.floor(rnd() * land.length)];
        if (Math.hypot(t.x - world.camp.x, t.y - world.camp.y) < 6 && type === 'wolf') { i--; continue; }
        sim.animals.push({ id: sim.nextId++, type, x: t.x + 0.5, y: t.y + 0.5, dir: rnd() * 6.28, hunger: rnd() * 30, alive: true, flee: 0 });
      }
    };
    add('rabbit', 26); add('deer', 10); add('wolf', 4);
  };

  V.stepAnimals = function (sim) {
    const { world, rnd, animals } = sim;
    const counts = { rabbit: 0, deer: 0, wolf: 0, dog: 0 };
    for (const a of animals) if (a.alive) counts[a.type]++;
    const born = [];
    for (const a of animals) {
      if (!a.alive) continue;
      const spec = V.ANIMALS[a.type];
      let speed = spec.speed * 0.45;
      if (a.trust && !a.tame && a.type !== 'dog') a.trust = Math.max(0, a.trust - 0.004);     // без підгодовування довіра повільно згасає
      if (a.type === 'dog') {
        // собака ходить за господарем, допомагає на полюванні й відганяє диких вовків
        let owner = sim.npcs.find(n => n.id === a.owner);
        if (!owner && sim.npcs.length) { owner = sim.npcs[0]; a.owner = owner.id; }
        a.hunger = Math.max(0, a.hunger - 0.05);            // собак підгодовують у таборі
        const hunt = owner && owner.task && owner.task.type === 'hunt' && owner.task.phase === 1 ? animals.find(b => b.id === owner.task.target && b.alive) : null;
        const wild = animals.find(b => b.alive && b.type === 'wolf' && Math.hypot(b.x - a.x, b.y - a.y) < 5);
        const tgt = hunt || wild || owner;
        if (tgt) {
          const d = Math.hypot(tgt.x - a.x, tgt.y - a.y);
          if (tgt === owner ? d > 1.4 : true) { a.dir = Math.atan2(tgt.y - a.y, tgt.x - a.x); speed = spec.speed * (tgt === owner && d < 4 ? 0.8 : 1.2); }

  const SAVE_VERSION = 1;
