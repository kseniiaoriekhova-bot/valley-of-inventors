<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Долина винахідників</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <h1 data-i18n="title">Долина винахідників</h1>
    <span class="era" id="era"></span>
  </div>
  <div class="clock">
    <span class="day" id="day"></span>
    <span class="sun" id="sun" aria-hidden="true"></span>
  </div>
  <div class="controls" role="group" data-i18n-aria="aria.speed">
    <button id="pause" class="ctl">❚❚</button>
    <button class="ctl spd" data-s="1">1×</button>
    <button class="ctl spd" data-s="4">4×</button>
    <button class="ctl spd" data-s="15">15×</button>
    <button class="ctl spd" data-s="50">50×</button>
  </div>
  <button class="llmchip" id="llmChip" data-mode="off"><span class="ld" aria-hidden="true"></span><span id="llmChipText"></span></button>
  <div class="langs" role="group" aria-label="Мова / Sprache">
    <button class="ctl lang" data-lang="uk" lang="uk">UK</button>
    <button class="ctl lang" data-lang="de" lang="de">DE</button>
  </div>
</header>

<section class="stats" id="stats"></section>

<div class="banner" id="llmBanner" role="status" hidden>
  <span class="bt" id="llmBannerText"></span>
  <span class="bb">
    <button class="btn small" id="llmBannerPause"></button>
    <button class="iconbtn" id="llmBannerClose" data-i18n-aria="banner.close">✕</button>
  </span>
</div>

<main class="layout">
  <div class="stage">
    <div class="canvas-box">
      <div class="canvas-wrap" id="canvasWrap"><canvas id="world" data-i18n-aria="mapLabel"></canvas></div>
      <div class="zoom" role="group">
        <button class="ctl" id="zoomIn" data-i18n-aria="zoomIn">＋</button>
        <button class="ctl" id="zoomOut" data-i18n-aria="zoomOut">－</button>
      </div>
    </div>
    <div class="strip" id="strip" role="listbox" data-i18n-aria="strip"></div>
    <p class="legend">
      <span><i class="lg" style="background:#f1ece2"></i><span data-i18n="lg.rabbit"></span></span>
      <span><i class="lg" style="background:#9a6a3a"></i><span data-i18n="lg.deer"></span></span>
      <span><i class="lg" style="background:#4b4f55"></i><span data-i18n="lg.wolf"></span></span>
      <span><i class="lg dia" style="background:#3fbf8f"></i><span data-i18n="lg.ore"></span></span>
      <span><i class="lg" style="background:#ffcf5a"></i><span data-i18n="lg.exp"></span></span>
      <span class="hint" data-i18n="lg.hint"></span>
    </p>
  </div>

  <aside class="panel">
    <nav class="tabs" role="tablist">
      <button class="tab on" data-tab="chron" role="tab" data-i18n="tab.chron"></button>
      <button class="tab" data-tab="people" role="tab" data-i18n="tab.people"></button>
      <button class="tab" data-tab="disc" role="tab" data-i18n="tab.disc"></button>
      <button class="tab" data-tab="brain" role="tab" data-i18n="tab.brain"></button>
      <button class="tab" data-tab="worlds" role="tab" data-i18n="tab.worlds"></button>
    </nav>

    <div class="pane on" id="pane-chron">
      <div class="chips" id="chronFilter">
        <button class="chip on" data-f="all" data-i18n="f.all"></button>
        <button class="chip" data-f="discovery" data-i18n="f.discovery"></button>
        <button class="chip" data-f="idea" data-i18n="f.idea"></button>
        <button class="chip" data-f="together" data-i18n="f.together"></button>
        <button class="chip" data-f="talk" data-i18n="f.talk"></button>
        <button class="chip" data-f="life" data-i18n="f.life"></button>
      </div>
      <ol class="chron" id="chron"></ol>
    </div>

    <div class="pane" id="pane-people">
      <div id="person"></div>
      <ul class="people" id="people"></ul>
    </div>

    <div class="pane" id="pane-disc">
      <div id="disc"></div>
    </div>

    <div class="pane" id="pane-brain">
      <section class="card">
        <h2 data-i18n="llm.title"></h2>
        <p class="muted" data-i18n="llm.intro"></p>
        <div class="presets" role="group">
          <button class="preset" data-preset="cloudflare"><b>Cloudflare</b><span data-i18n="p.cf"></span></button>
          <button class="preset" data-preset="openrouter"><b>OpenRouter</b><span data-i18n="p.or"></span></button>
          <button class="preset" data-preset="ollama"><b>Ollama</b><span data-i18n="p.ol"></span></button>
          <button class="preset" data-preset="lmstudio"><b>LM Studio</b><span data-i18n="p.lm"></span></button>
        </div>
        <p class="presetnote" id="presetNote" hidden></p>
        <div class="row gap">
          <label class="row switch"><input type="checkbox" id="llmOn"> <span data-i18n="llm.on"></span></label>
          <button class="btn ghost" id="llmPause"></button>
        </div>
        <div class="grid2">
          <label for="llmProv" data-i18n="llm.server"></label>
          <select id="llmProv"><option value="ollama">Ollama</option><option value="openai" data-i18n="llm.compat"></option></select>
          <label for="llmUrl" data-i18n="llm.url"></label>
          <input id="llmUrl" type="text" spellcheck="false">
          <label for="llmModel" data-i18n="llm.model"></label>
          <input id="llmModel" type="text" spellcheck="false" list="llmModels">
          <datalist id="llmModels"></datalist>
          <label for="llmKey" data-i18n="llm.key"></label>
          <input id="llmKey" type="password">
        </div>
        <label class="row"><input type="checkbox" id="llmPlans"> <span data-i18n="llm.plans"></span></label>
        <label class="row"><input type="checkbox" id="llmChat"> <span data-i18n="llm.chat"></span></label>
        <div class="row gap"><button class="btn" id="llmTest" data-i18n="llm.test"></button><span class="status" id="llmStatus"></span></div>
        <ol class="llmlog" id="llmLog"></ol>
      </section>
      <section class="card">
        <h2 data-i18n="how.title"></h2>
        <ul class="plain">
          <li data-i18n-html="how.cf"></li>
          <li data-i18n-html="how.or"></li>
          <li data-i18n-html="how.ol"></li>
        </ul>
        <p class="muted" data-i18n="how.note"></p>
      </section>
      <section class="card">
        <h2 data-i18n="about.title"></h2>
        <ul class="plain">
          <li data-i18n-html="about.1"></li>
          <li data-i18n-html="about.2"></li>
          <li data-i18n-html="about.3"></li>
          <li data-i18n-html="about.4"></li>
        </ul>
      </section>
    </div>

    <div class="pane" id="pane-worlds">
      <section class="card">
        <h2 data-i18n="w.current"></h2>
        <div class="grid2">
          <label for="civName" data-i18n="w.name"></label>
          <input id="civName" type="text" maxlength="40" spellcheck="false">
        </div>
        <p class="muted" id="civInfo"></p>
        <div class="row gap">
          <button class="btn" id="saveNow" data-i18n="w.save"></button>
          <span class="status" id="saveStatus"></span>
        </div>
        <p class="muted" data-i18n="w.auto"></p>
      </section>
      <section class="card">
        <div class="row gap"><button class="btn" id="newWorld" data-i18n="w.new"></button></div>
        <p class="muted" data-i18n="w.newNote"></p>
      </section>
      <section class="card">
        <h2 data-i18n="w.list"></h2>
        <ul class="civs" id="civList"></ul>
        <p class="muted" data-i18n="w.local"></p>
      </section>
    </div>
  </aside>
</main>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/sim.js"></script>
<script src="js/llm.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
